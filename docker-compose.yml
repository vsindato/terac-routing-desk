services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: terac
      POSTGRES_PASSWORD: terac
      POSTGRES_DB: routing_desk
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terac -d routing_desk"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
